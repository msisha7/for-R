<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --dark: #0f111a;
            --light: #f5f5f5;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        /* --- 1. Global Animated Background --- */
        body {
            font-family: 'Poppins', sans-serif;
            /* Deep, romantic night sky gradient */
            background: linear-gradient(-45deg, #05070e, #130a1c, #0a1128, #180a1a);
            background-size: 400% 400%;
            animation: mainBgAnimation 25s ease infinite;
            color: var(--light);
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        @keyframes mainBgAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        /* --- Hero Section --- */
        .hero {
            position: relative;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: transparent; 
            padding: 0 20px;
        }
        
        .hero-content {
            z-index: 10;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            padding: 50px 60px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            max-width: 800px;
            width: 90%;
        }
        
        .title {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(2.5rem, 5vw, 4.5rem);
            background: -webkit-linear-gradient(45deg, #ff9a9e, #fecfef);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            min-height: 100px; 
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.5));
        }
        
        .subtitle {
            font-size: clamp(1rem, 2vw, 1.2rem);
            line-height: 1.6;
            margin-bottom: 30px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 1s ease 0.5s;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }
        .subtitle.visible { opacity: 1; transform: translateY(0); }
        
        .btn {
            display: inline-block;
            padding: 15px 40px;
            font-size: 1.1rem;
            color: #fff;
            background: linear-gradient(45deg, #ff007f, #7928ca);
            border: none;
            border-radius: 30px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            opacity: 0;
            transform: translateY(20px);
            box-shadow: 0 10px 25px rgba(255, 0, 127, 0.5);
            font-weight: 600;
        }
        .btn.visible { opacity: 1; transform: translateY(0); }
        .btn:hover { transform: translateY(-5px) scale(1.05); box-shadow: 0 15px 35px rgba(255, 0, 127, 0.7); }

        /* --- Ambient Pink Particles --- */
        #particles { 
            position: fixed; 
            top: 0; left: 0; width: 100vw; height: 100vh; 
            pointer-events: none; z-index: 0; 
        }
        .particle {
            position: absolute;
            background: #ff7eb3;
            border-radius: 50%;
            animation: floatUp infinite linear;
            opacity: 0.3;
            box-shadow: 0 0 15px #ff7eb3;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 0.5; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }

        /* --- NEW: Twinkling Stars Background --- */
        #twinkling-stars {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 0;
        }
        .twinkle-star {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            animation: twinkle ease-in-out infinite;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.1; transform: scale(0.8); }
            50% { opacity: 0.8; transform: scale(1.2); box-shadow: 0 0 8px #fff; }
        }

        /* --- NEW: Shooting Stars --- */
        #shooting-stars {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }
        .shooting-star {
            position: absolute;
            width: 150px;
            height: 2px;
            /* Fades out at the tail, bright at the head */
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), rgba(255,255,255,1));
            border-radius: 50%;
            transform-origin: right center;
            animation: shoot linear forwards;
        }
        .shooting-star::after {
            /* The bright glowing head of the shooting star */
            content: '';
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 4px; height: 4px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 15px 3px #fff, 0 0 25px 6px #ff7eb3;
        }
        @keyframes shoot {
            0% {
                transform: rotate(35deg) translateX(-100vw);
                opacity: 0;
            }
            10% { opacity: 1; }
            80% { opacity: 1; }
            100% {
                transform: rotate(35deg) translateX(100vw);
                opacity: 0;
            }
        }

        /* --- Scroll Alternating Gallery Section --- */
        .scroll-gallery {
            padding: 100px 0;
            background: transparent;
            position: relative;
            z-index: 5;
        }

        .memory-row {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 85vh;
            padding: 50px 10%;
            max-width: 1600px;
            margin: 0 auto;
        }

        .memory-row.reverse {
            flex-direction: row-reverse;
        }

        .memory-text {
            flex: 1;
            padding: 0 60px;
        }

        .memory-text h3 {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(2.5rem, 4vw, 4rem);
            background: -webkit-linear-gradient(45deg, #ff7eb3, #ff758c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            line-height: 1.2;
            text-shadow: 1px 1px 15px rgba(255, 126, 179, 0.2);
        }

        .memory-text p {
            font-size: 1.3rem;
            line-height: 1.8;
            color: #cbd5e1;
            font-weight: 300;
        }

        .memory-img {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* --- Image Tilt and Glow Animation --- */
        .img-frame {
            position: relative;
            padding: 12px;
            border-radius: 20px;
            z-index: 1;
            transform: rotate(var(--tilt, 0deg));
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .img-frame::before {
            content: '';
            position: absolute;
            top: -4px; left: -4px; right: -4px; bottom: -4px;
            background: linear-gradient(45deg, #ff007f, #7928ca, #00f2fe, #ff007f);
            background-size: 300% 300%;
            z-index: -2;
            border-radius: 24px;
            animation: animateGradient 4s ease infinite;
            filter: blur(12px);
            opacity: 0.9;
        }
        
        .img-frame::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(20, 25, 40, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            z-index: -1;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        @keyframes animateGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .img-frame img {
            display: block;
            width: 100%;
            max-width: 480px;
            height: auto;
            max-height: 70vh;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 2;
        }

        .img-frame:hover {
            transform: scale(1.05) translateY(-10px) rotate(0deg);
        }

        /* --- Scroll Reveal Animations --- */
        .hidden-left {
            opacity: 0;
            transform: translateX(-150px);
            transition: all 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .hidden-right {
            opacity: 0;
            transform: translateX(150px);
            transition: all 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .show-element {
            opacity: 1;
            transform: translateX(0);
        }

        /* --- Responsive Layout for Phones --- */
        @media (max-width: 992px) {
            .memory-row, .memory-row.reverse {
                flex-direction: column !important;
                text-align: center;
                padding: 60px 20px;
                min-height: auto;
            }
            .memory-text {
                padding: 0 10px 40px 10px;
            }
            .hidden-left, .hidden-right {
                transform: translateY(100px);
            }
        }
        
        .footer {
            text-align: center;
            padding: 40px;
            background: rgba(8, 10, 16, 0.8);
            backdrop-filter: blur(5px);
            color: #888;
            position: relative;
            z-index: 5;
        }
    </style>
</head>
<body>

    <!-- Magic Background Elements -->
    <div id="twinkling-stars"></div>
    <div id="shooting-stars"></div>
    <div id="particles"></div>

    <div class="hero">
        <div class="hero-content">
            <h1 class="title" id="typing-text"></h1>
            <p class="subtitle" id="subtitle">I really enjoyed our conversation. I thought I'd put this together just to show you how much you made me smile today. 😊</p>
            <a href="#gallery" class="btn" id="explore-btn">Scroll Down ✨</a>
        </div>
    </div>

    <div class="scroll-gallery" id="gallery">
        <!-- Javascript will generate the 16 alternating rows here -->
    </div>
    
    <div class="footer">
        <p>Made with ❤️ specifically to make you smile.</p>
    </div>

    <script>
        // --- Hero Typing Effect ---
        const text = "To the girl with the incredible vibe...";
        const typingElement = document.getElementById('typing-text');
        let index = 0;

        function typeWriter() {
            if (index < text.length) {
                typingElement.innerHTML += text.charAt(index);
                index++;
                setTimeout(typeWriter, 80);
            } else {
                document.getElementById('subtitle').classList.add('visible');
                setTimeout(() => {
                    document.getElementById('explore-btn').classList.add('visible');
                }, 400);
            }
        }
        setTimeout(typeWriter, 500);

        // --- Twinkling Stars Background ---
        const twinkleContainer = document.getElementById('twinkling-stars');
        for (let i = 0; i < 150; i++) {
            let s = document.createElement('div');
            s.className = 'twinkle-star';
            // Mostly tiny stars, a few larger ones
            let size = Math.random() < 0.9 ? (Math.random() * 2 + 1) : (Math.random() * 2 + 2);
            s.style.width = size + 'px';
            s.style.height = size + 'px';
            s.style.top = Math.random() * 100 + 'vh';
            s.style.left = Math.random() * 100 + 'vw';
            s.style.animationDuration = (Math.random() * 3 + 2) + 's';
            s.style.animationDelay = (Math.random() * 5) + 's';
            twinkleContainer.appendChild(s);
        }

        // --- Shooting Stars ---
        const shootingStarsContainer = document.getElementById('shooting-stars');
        function createShootingStar() {
            let star = document.createElement('div');
            star.className = 'shooting-star';
            
            // Random start height, biased towards upper half
            star.style.top = (Math.random() * 70) + 'vh';
            
            // Fast duration so they look like real shooting stars
            let duration = (Math.random() * 1.5) + 1.2; 
            star.style.animationDuration = duration + 's';
            
            shootingStarsContainer.appendChild(star);
            
            setTimeout(() => {
                star.remove();
            }, duration * 1000);
        }

        function spawnStarLoop() {
            createShootingStar();
            // Wait 2 to 6 seconds before the next one
            setTimeout(spawnStarLoop, (Math.random() * 4000) + 2000); 
        }
        setTimeout(spawnStarLoop, 1500);

        // --- Ambient Glowing Particles ---
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 30; i++) {
            let p = document.createElement('div');
            p.className = 'particle';
            let size = Math.random() * 5 + 2;
            p.style.width = size + 'px';
            p.style.height = size + 'px';
            p.style.left = Math.random() * 100 + 'vw';
            p.style.animationDuration = (Math.random() * 15 + 15) + 's';
            p.style.animationDelay = (Math.random() * 10) + 's';
            particlesContainer.appendChild(p);
        }

        // --- Gallery Content Data ---
        const phrases = [
            { title: "That Beautiful Smile ✨", desc: "It honestly brightens up my whole day. Just breathtaking." },
            { title: "Our Conversation...", desc: "I loved every second of it. Two hours felt like two minutes." },
            { title: "An Instant Click 💫", desc: "It's so rare to connect with someone so effortlessly and quickly." },
            { title: "Your Amazing Vibe 🌸", desc: "You have this incredible aura around you that just draws people in." },
            { title: "Lost in Time ⏳", desc: "Time literally flew by when we were talking to each other." },
            { title: "Still Smiling 😊", desc: "I couldn't stop smiling long after we finished our chat." },
            { title: "Beyond Gorgeous 🤍", desc: "You're so much more than just a beautiful face." },
            { title: "Those Eyes ✨", desc: "There's something truly magical about the way you look." },
            { title: "Taking a Chance 🦋", desc: "I'm really, really glad I decided to randomly message you." },
            { title: "Day Maker ☀️", desc: "Just looking at this picture instantly makes my day better." },
            { title: "Pure Soul 🕊️", desc: "Even in just 2 days, you seem to have such a genuine heart." },
            { title: "A Little Surprise 🎁", desc: "Hoping this random little webpage brings a huge smile to your face!" },
            { title: "You Deserve It 👑", desc: "Because someone as special as you deserves to be celebrated." },
            { title: "Effortless ✨", desc: "How are you so effortlessly stunning in every single picture?" },
            { title: "To The Future 🥂", desc: "I honestly can't wait to get to know you even better." },
            { title: "Just Remember ❤️", desc: "You are absolutely amazing, never forget that." }
        ];

        const galleryContainer = document.getElementById('gallery');

        phrases.forEach((item, idx) => {
            const i = idx + 1; 
            const isEven = idx % 2 !== 0; 
            
            const row = document.createElement('div');
            row.className = `memory-row ${isEven ? 'reverse' : ''}`;
            
            const textClass = isEven ? 'hidden-right' : 'hidden-left';
            const imgClass = isEven ? 'hidden-left' : 'hidden-right';
            
            // Alternating base tilt (-2 to -4 on one side, 2 to 4 on the other)
            let tiltAngle = isEven ? (2 + Math.random()*2) : (-2 - Math.random()*2);

            row.innerHTML = `
                <div class="memory-text ${textClass}">
                    <h3>${item.title}</h3>
                    <p>${item.desc}</p>
                </div>
                <div class="memory-img ${imgClass}">
                    <!-- Pass tilt angle as a CSS variable for the frame -->
                    <div class="img-frame" style="--tilt: ${tiltAngle}deg;">
                        <img src="${i}.jpg" alt="Picture ${i}" loading="lazy">
                    </div>
                </div>
            `;
            galleryContainer.appendChild(row);
        });

        // --- Intersection Observer for Scroll Trigger ---
        const observerOptions = {
            threshold: 0.3 
        };

        const scrollObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('show-element');
                }
            });
        }, observerOptions);

        setTimeout(() => {
            document.querySelectorAll('.memory-text, .memory-img').forEach(el => {
                scrollObserver.observe(el);
            });
        }, 100);
        
    </script>
</body>
</html>
